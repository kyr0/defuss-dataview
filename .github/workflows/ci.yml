name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # bun is the package manager (package.json packageManager); Node from the matrix runs the scripts and tests.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: defuss-dataview-node-${{ matrix.node }}
          path: |
            artifacts/
            dist/stats.json
            coverage/coverage-summary.json
