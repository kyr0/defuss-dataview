# defuss-vae CI: the same bootstrap and verbs as local development, so CI cannot drift from `make verify`.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Release tooling targets Node 22 or newer (RELEASE.md); the runner default may differ.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun is the package manager (package.json packageManager); Node runs the tests and scripts.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: make setup
      # Chromium system libraries need root; make setup stays sudo-free for local use.
      - run: bunx playwright install-deps chromium
      - run: make verify
